version: 2

updates:
  - package-ecosystem: github-actions
    # One directory per external-pin slot: the workflow directory (/) plus every
    # composite action directory that pins its own external `uses:`. Without the
    # per-action entries the subdirectory composites' pins go uncovered.
    directories:
      - /
      - /maven-central
      - /npm
      - /pypi
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      # gh-actions is the action catalog; when its own CI or composites consume
      # sibling InditexTech/gh-actions/* actions, bump them together in one PR.
      first-party-actions:
        patterns:
          - InditexTech/gh-actions/*
