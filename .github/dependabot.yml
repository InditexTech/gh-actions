version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      # gh-actions is the action catalog; when its own CI or composites consume
      # sibling InditexTech/gh-actions/* actions, bump them together in one PR.
      first-party-actions:
        patterns:
          - InditexTech/gh-actions/*
