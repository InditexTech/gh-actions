name: Verify shared actions catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-shared-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Local action catalog contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate action metadata with exact tool binary
        env:
          ACTION_VALIDATOR_SHA256: 9f42f94fca5b8d04c13bccfbb331104b37a9250650d89ae58dc888d46206f9b9
          ACTION_VALIDATOR_VERSION: 0.9.0
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/action-validator"
          curl --fail --location --silent --show-error \
            "https://github.com/mpalmer/action-validator/releases/download/v${ACTION_VALIDATOR_VERSION}/action-validator_linux_amd64" \
            --output "$binary"
          echo "$ACTION_VALIDATOR_SHA256  $binary" | sha256sum --check
          chmod 0755 "$binary"
          "$binary" maven-central/action.yml
          "$binary" npm/action.yml
          "$binary" pypi/action.yml
          "$binary" .github/workflows/verify.yml

      - name: Compile and test runtime validators
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            maven-central/scripts/inject_publish_pom.py \
            maven-central/scripts/validate_publish.py \
            npm/scripts/validate_npm_publish.py \
            pypi/scripts/validate_distributions.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

  local-action:
    name: Local composite preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create inert distribution fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/local-action-0.0.0-py3-none-any.whl

      - name: Reject publishing without OIDC permission
        id: missing-oidc
        continue-on-error: true
        uses: ./pypi
        with:
          packages-dir: dist

      - name: Assert local action failed closed
        env:
          PREFLIGHT_OUTCOME: ${{ steps.missing-oidc.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_OUTCOME" == "failure" ]]

  local-action-maven-central:
    name: Local Maven Central composite preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create inert reactor fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p code
          printf '%s\n' \
            '<project xmlns="http://maven.apache.org/POM/4.0.0">' \
            '  <modelVersion>4.0.0</modelVersion>' \
            '  <groupId>com.inditextech</groupId>' \
            '  <artifactId>preflight</artifactId>' \
            '  <version>0.0.0</version>' \
            '</project>' > code/pom.xml

      - name: Reject publishing without signing and publish credentials
        id: missing-credentials
        continue-on-error: true
        uses: ./maven-central
        with:
          working-directory: code
          project-type: single

      - name: Assert local action failed closed
        env:
          PREFLIGHT_OUTCOME: ${{ steps.missing-credentials.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_OUTCOME" == "failure" ]]

  local-action-npm:
    name: Local npm composite preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create inert package fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p code dist
          printf '{"name":"@inditextech/preflight","version":"0.0.0"}\n' > code/package.json
          : > dist/inditextech-preflight-0.0.0.tgz

      - name: Reject publishing without OIDC or a fallback token
        id: missing-credentials
        continue-on-error: true
        uses: ./npm
        with:
          working-directory: code
          project-type: single
          artifact-directory: dist

      - name: Assert local action failed closed
        env:
          PREFLIGHT_OUTCOME: ${{ steps.missing-credentials.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_OUTCOME" == "failure" ]]

  actionlint:
    name: GitHub Actions syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write # Lets reviewdog publish actionlint check results.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
        with:
          reporter: github-check
          fail_level: error

  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows maven-central/action.yml npm/action.yml pypi/action.yml
          collect: workflows,actions
          online-audits: false
          persona: pedantic
          version: 1.29.0
          advanced-security: false
          annotations: true
