---
name: Verify base archetype

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable base-archetype commit to validate.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out base-archetype candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned workflow linter
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint base workflows
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Validate base asset contract
        uses: InditexTech/gh-actions/base-archetype-integrity@ea9346718becaec10056e0257baf611734aea3d9

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out base-archetype candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Scan candidate workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
          collect: workflows
          online-audits: false
          persona: pedantic
          version: 1.29.0
          advanced-security: false
          annotations: true
