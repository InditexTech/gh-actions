name: Publish a Maven reactor to Maven Central
description: >-
  Sign and publish a checked-out Maven reactor to the Central Portal with the
  governed central-publishing and GPG plugins, injected only for this deploy so
  the consumer pom.xml stays free of publish plumbing.
inputs:
  working-directory:
    description: >-
      Reactor root relative to the workspace (the parent pom.xml lives here).
    required: true
  project-type:
    description: Governed layout of the reactor, either 'single' or 'monorepo'.
    required: true
  packages:
    description: >-
      Comma-separated released module artifactIds for an independent monorepo
      release; each is resolved to its unique reactor module directory (flat or
      nested) before publishing. Empty publishes the whole reactor (single and
      locked-step).
    required: false
    default: ''
  strategy:
    description: >-
      Publish strategy. Only 'maven-central-gpg' is implemented; 'oidc' is a
      reserved seam and is rejected until it ships.
    required: false
    default: maven-central-gpg
  auto-publish:
    description: >-
      Exact boolean. 'true' releases automatically and waits until the Portal
      reports the bundle published; 'false' stops at a validated deployment.
    required: false
    default: 'true'
  extra-maven-arguments:
    description: >-
      Newline-delimited Maven arguments appended literally to the governed
      deploy command.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Validate publish boundary
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PROJECT_TYPE: ${{ inputs.project-type }}
        STRATEGY: ${{ inputs.strategy }}
        PACKAGES: ${{ inputs.packages }}
        AUTO_PUBLISH: ${{ inputs.auto-publish }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/scripts/validate_publish.py"
        --working-directory "$WORKING_DIRECTORY"
        --project-type "$PROJECT_TYPE"
        --strategy "$STRATEGY"
        --packages "$PACKAGES"
        --auto-publish "$AUTO_PUBLISH"
        --output "$RUNNER_TEMP/maven-central-resolved-packages.txt"

    - name: Import signing key
      shell: bash
      run: |
        set -euo pipefail
        printf '%s' "$CI_GPG_SECRET_KEY" | gpg --batch --import

    - name: Prepare ephemeral publish configuration
      id: publish_config
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        AUTO_PUBLISH: ${{ inputs.auto-publish }}
      run: |
        set -euo pipefail
        settings="$RUNNER_TEMP/maven-central-settings.xml"
        python3 "$GITHUB_ACTION_PATH/scripts/inject_publish_pom.py" \
          --pom "$GITHUB_WORKSPACE/$WORKING_DIRECTORY/pom.xml" \
          --settings "$settings" \
          --auto-publish "$AUTO_PUBLISH"
        # Hand the settings path to the publish step via a step output rather
        # than GITHUB_ENV: the value never becomes an ambient env var for
        # unrelated steps (avoids the zizmor github-env code-execution sink).
        echo "settings=$settings" >> "$GITHUB_OUTPUT"

    - name: Publish to Maven Central
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MAVEN_CENTRAL_SETTINGS: ${{ steps.publish_config.outputs.settings }}
        PACKAGES: ${{ inputs.packages }}
        AUTO_PUBLISH: ${{ inputs.auto-publish }}
        EXTRA_MAVEN_ARGUMENTS: ${{ inputs.extra-maven-arguments }}
      run: |
        set -euo pipefail
        # The GPG plugin reads the passphrase from MAVEN_GPG_PASSPHRASE; the
        # value stays in the process environment and is never written to disk.
        export MAVEN_GPG_PASSPHRASE="$CI_GPG_SECRET_KEY_PASSWORD"
        wait_until=validated
        if [[ "$AUTO_PUBLISH" == "true" ]]; then
          wait_until=published
        fi
        args=(
          --batch-mode
          --no-transfer-progress
          -DskipTests
          "-DautoPublish=$AUTO_PUBLISH"
          "-DwaitUntil=$wait_until"
          -s "$MAVEN_CENTRAL_SETTINGS"
        )
        selected=""
        if [[ -s "$RUNNER_TEMP/maven-central-resolved-packages.txt" ]]; then
          # Independent release: publish only the released reactor modules, as
          # their validator-resolved reactor-relative module paths (nested
          # reactors included). This file is empty when no packages were given.
          selected="$(tr -d ' \r\n\t' < "$RUNNER_TEMP/maven-central-resolved-packages.txt")"
        elif [[ -n "${PACKAGES// /}" ]]; then
          # The boundary validator is pinned to the same action revision and
          # always writes the resolved file, so this is unreachable-by-design;
          # fail loudly instead of silently publishing the whole reactor.
          echo "resolved packages file is missing after validation" >&2
          exit 1
        fi
        if [[ -n "$selected" ]]; then
          args+=(-pl "$selected")
        fi
        while IFS= read -r argument; do
          if [[ -n "$argument" ]]; then
            args+=("$argument")
          fi
        done <<< "$EXTRA_MAVEN_ARGUMENTS"
        mvn "${args[@]}" deploy
