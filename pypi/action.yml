name: Validate Python distributions for trusted publishing
description: >-
  Validate a flat set of pre-built Python distributions against the PyPI
  trusted-publishing boundary. The caller publishes the validated
  distributions itself by invoking pypa/gh-action-pypi-publish directly as a
  job step.

inputs:
  packages-dir:
    description: Directory containing the pre-built Python distributions.
    required: true
  repository-url:
    description: Official PyPI or TestPyPI legacy endpoint. Use TestPyPI only in a protected test environment.
    required: false
    default: 'https://upload.pypi.org/legacy/'
  attestations:
    description: Whether the caller will publish PEP 740 attestations. Validated here; forward the same value to pypa.
    required: false
    default: 'true'
  skip-existing:
    description: Whether the caller will tolerate already-published distribution files when resuming a release. Validated here; forward the same value to pypa.
    required: false
    default: 'false'
  verify-metadata:
    description: Whether the caller will verify distribution metadata before uploading. Validated here; forward the same value to pypa.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Validate trusted publishing boundary
      shell: bash
      env:
        ATTESTATIONS: ${{ inputs.attestations }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
        SKIP_EXISTING: ${{ inputs.skip-existing }}
        VERIFY_METADATA: ${{ inputs.verify-metadata }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/scripts/validate_distributions.py"
        "$PACKAGES_DIR"
        --repository-url "$REPOSITORY_URL"
        --attestations "$ATTESTATIONS"
        --skip-existing "$SKIP_EXISTING"
        --verify-metadata "$VERIFY_METADATA"
