name: Verify base sync workflow behavior
description: Exercise the checked-out sync-to-develop workflow in hermetic Git and GitHub CLI fixtures.

inputs:
  source-root:
    description: Root of the checked-out base-archetype source tree.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Exercise sync workflow behavior
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
      run: >-
        python3 "${{ github.action_path }}/verify_sync_to_develop.py"
        --workflow "$SOURCE_ROOT/.github/workflows/sync-to-develop.yml"
