name: Verify base archetype source
description: Validate a checked-out base-archetype source tree without executing candidate code.

inputs:
  source-root:
    description: Root of the checked-out base-archetype source tree.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Validate source assets
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
      run: >-
        python3 "${{ github.action_path }}/verify_base_archetype.py"
        --source-root "$SOURCE_ROOT"
        --contract "${{ github.action_path }}/contract.json"
